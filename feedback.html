  <main id="main-content" tabindex="-1">
    <h1>Feedback</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>How would you rate Student Hub?</legend>
        <p>
          <input type="radio" id="r5" name="rating" value="5" required>
          <label for="r5">5 - Excellent</label><br>
          <input type="radio" id="r4" name="rating" value="4">
          <label for="r4">4 - Good</label><br>
          <input type="radio" id="r3" name="rating" value="3">
          <label for="r3">3 - Average</label><br>
          <input type="radio" id="r2" name="rating" value="2">
          <label for="r2">2 - Poor</label>
        </p>
      </fieldset>
      <p>
        <label for="f-comments">Your comments</label>
        <textarea id="f-comments" name="comments" rows="5"></textarea>
      </p>
      <p><button type="submit">Submit feedback</button></p>
    </form>
  </main>
